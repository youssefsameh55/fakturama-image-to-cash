# UI label strings, timeouts and mappings. Labels were taken from tools/dump_tree.py probe dumps.

app:
  window_title_regex: ".*Fakturama.*"   # overridden by FAKTURAMA_WINDOW_TITLE in .env
  backend: uia

timeouts:            # seconds
  default: 10
  window: 15
  table_stable: 8
  save: 15
  poll_interval: 0.1             # UIA snapshots are one cached call now: cheap to poll

ocr:
  upscale: 1                     # measured on probe screenshots: 2x upscaling hurts on a high-DPI screen
  language: en-US
  row_merge_tolerance_px: 8      # words whose centre-y differ by less than this are one row

input:
  text_methods: [keys, value]    # live: UIA SetValue changed the Debtor's Company box on screen but not in
                                 # Fakturama's data (saved empty) -> real keystrokes first; all read back
  date_pattern: "{mon} {day}, {year}"   # probe: Fakturama shows 'Nov 7, 2026'
  key_pause: 0.01                # s between keystrokes (pywinauto default 0.05)
  close_editor_keys: ["^w", "^{F4}"]   # close a SAVED master-data editor (fewer open editors = faster UIA reads)
  date_method: arrows            # arrows | text. Live: text set via UIA reverted to today -> arrow keys per field

tables:                          # canonical column headers (OCR text is fuzzy-matched to these)
  select_address: ["No.", "First Name", "Name", "Company", "ZIP", "City", "address type"]
  select_product: ["Item No.", "Name", "Description", "Stock", "Price", "VAT"]
  items: ["Pos.", "Qty.", "Item No.", "Picture", "Name", "Description", "VAT", "U.Price", "Discount", "Price"]
  documents: ["Document", "Date", "Name", "Cust.Ref.", "State", "Total", "Printed"]
  vats: ["Standard", "Name", "Description", "Value"]
  debtors: ["No.", "First Name", "Name", "Company", "ZIP", "City"]

tables_checked:                  # columns some check reads; OCR re-reads of dropped cells only here
  select_address: ["No.", "First Name", "Name", "Company", "ZIP", "City"]
  select_product: ["Item No.", "Name"]
  items: ["Qty.", "Item No.", "VAT", "U.Price", "Discount", "Price"]
  documents: ["Document", "Date", "Cust.Ref.", "State", "Total"]
  vats: ["Name", "Description", "Value"]
  debtors: ["No.", "First Name", "Name", "Company"]
  payments: ["Standard", "Name", "Description", "Discount", "Disc. Days", "Net Days"]

extraction:                      # PROMPT_VERSION lives in src/i2c/extract/prompt.py (it versions code)
  max_image_long_side: 1568
  max_tokens: 4096

money:
  tolerance: "0.01"

matching:
  product_description_mismatch: warn   # warn | stop

payment_method_codes:                  # extracted method -> Fakturama payment code
  "Bank Transfer": "Credit transfer"
  "Credit Card": "Credit card"
  "SEPA Direct Debit": "SEPA direct debit"

vat:
  name_template: "VAT {percent}%"
  code: "S"

